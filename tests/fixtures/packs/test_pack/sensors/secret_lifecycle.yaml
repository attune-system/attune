ref: test_pack.secret_lifecycle
label: Secret lifecycle probe
description: Test-only probe for protected stdin and live rule configuration.
enabled: false
runner_type: python
entry_point: secret_lifecycle_sensor.py
config:
  input_permission_set_refs: [test_pack.sdk_key_reader, test_pack.sdk_key_decrypt]
parameters:
  credential: {type: string, secret: true}
  count: {type: integer, default: 3}
trigger_types:
  - test_pack.secret_lifecycle_probe
