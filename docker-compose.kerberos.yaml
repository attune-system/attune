services:
  worker-kerberos:
    extends:
      file: docker-compose.yaml
      service: worker-full
    container_name: attune-worker-kerberos
    profiles:
      - kerberos
    entrypoint:
      - /bin/sh
      - -c
      - |
        if ! command -v krb5-config >/dev/null 2>&1 || ! command -v gcc >/dev/null 2>&1; then
          installed=false
          for attempt in 1 2 3; do
            if DEBIAN_FRONTEND=noninteractive apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates git build-essential python3-dev libkrb5-dev >/dev/null 2>&1; then installed=true; break; fi
            sleep 2
          done
          [ "$$installed" = true ] || exit 1
        fi
        exec /opt/attune/agent/attune-agent
    environment:
      ATTUNE_WORKER_NAME: worker-kerberos-01
      ATTUNE__WORKER__LABELS__profile: kerberos
    labels:
      com.attune.service: worker-kerberos
      com.datadoghq.tags.service: attune-worker-kerberos
