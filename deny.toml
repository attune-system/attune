[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Patched rsa >=0.10.0 is available, but jsonwebtoken 10.4 and openidconnect
    # 4.1 still require rsa 0.9. jsonwebtoken 12 supports rsa 0.10; removing this
    # exception also requires upstream OIDC support and updated RSA test fixtures.
    "RUSTSEC-2023-0071",
    # Temporary risk acceptance for crypto-bigint 0.5.5 via JWT/OIDC's elliptic-curve
    # dependency. jsonwebtoken 12 and openidconnect 4.1 support patched >=0.7.6;
    # upgrading requires migrating Attune's custom JWT crypto provider. Review by
    # 2026-11-22; cargo-deny 0.20.2 does not support enforced ignore expiry.
    { id = "RUSTSEC-2026-0387", reason = "Upgrade to jsonwebtoken 12 and openidconnect 4.1, including custom JWT provider migration; tracked in PR #14; review by 2026-11-22" },
    # Temporary acceptance of these specific unmaintained-crate advisories; all
    # versions are affected and none has a patched release. These exceptions do
    # not suppress other advisories for the same crates. Review dates are manual,
    # not enforced expiry dates.
    # chrono is used directly across Attune and by SQLx, object_store, and OIDC.
    { id = "RUSTSEC-2026-0543", reason = "Accept chrono maintenance risk while migrating direct timestamp uses and upstream dependencies to maintained alternatives; remove when chrono leaves both workspace and timer graphs; review by 2026-12-17" },
    # humantime is transitive through object_store in attune-common.
    { id = "RUSTSEC-2026-0542", reason = "Accept humantime maintenance risk through object_store pending an upstream replacement or maintained storage dependency; remove when humantime leaves the workspace graph; review by 2026-12-17" },
    # chrono-tz is used directly by the timer and by rrule/tokio-cron-scheduler.
    { id = "RUSTSEC-2026-0555", reason = "Accept chrono-tz maintenance risk while migrating timer timezone handling and recurrence/scheduling dependencies to maintained alternatives; remove when chrono-tz leaves the timer graph; review by 2026-12-17" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "MIT-0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = [
    "base64",
    "core-foundation",
    "cpufeatures",
    "foldhash",
    "getrandom",
    "hashbrown",
    "nom",
    "r-efi",
    "rand",
    "rand_chacha",
    "rand_core",
    "thiserror",
    "thiserror-impl",
    "windows-sys",
    "windows-targets",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",
    "winnow",
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
