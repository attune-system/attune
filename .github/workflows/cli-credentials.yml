name: CLI credentials
on:
  pull_request:
    paths:
      - "crates/common/**"
      - "crates/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli-credentials.yml"
  push:
    branches: [main]
    paths:
      - "crates/common/**"
      - "crates/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cli-credentials.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  credentials:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-D warnings"
      ATTUNE_TEST_RUN_ID: clicredentials
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test shared authenticated encryption
        run: cargo test --locked --package attune-common --lib crypto::tests -- --test-threads=4
      - name: Test identifier binding and persistence
        run: cargo test --locked --package attune-cli --lib credential -- --test-threads=4
      - name: Test CLI and MCP credential lifecycle
        run: cargo test --locked --package attune-cli --test credential_storage_tests -- --test-threads=4
