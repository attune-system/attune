name: Publish Images and Helm Chart

permissions:
  contents: write
  packages: write

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY_HOST: ${{ vars.CONTAINER_REGISTRY_HOST }}
  REGISTRY_NAMESPACE: ${{ vars.CONTAINER_REGISTRY_NAMESPACE }}
  GNU_GLIBC_VERSION: "2.28"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_MIN_STACK: 67108864
  SQLX_OFFLINE: true

jobs:
  metadata:
    name: Resolve Publish Metadata
    runs-on: ubuntu-24.04
    outputs:
      registry: ${{ steps.meta.outputs.registry }}
      namespace: ${{ steps.meta.outputs.namespace }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_tags: ${{ steps.meta.outputs.image_tags }}
      chart_version: ${{ steps.meta.outputs.chart_version }}
      rust_bundle_matrix: ${{ steps.meta.outputs.rust_bundle_matrix }}
      linux_package_matrix: ${{ steps.meta.outputs.linux_package_matrix }}
      rust_image_matrix: ${{ steps.meta.outputs.rust_image_matrix }}
      web_image_matrix: ${{ steps.meta.outputs.web_image_matrix }}
    steps:
      - name: Resolve tags and registry paths
        id: meta
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          registry="${REGISTRY_HOST:-ghcr.io}"
          namespace="${REGISTRY_NAMESPACE}"

          if [ -z "$namespace" ]; then
            namespace="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          fi
          if [ "$registry" = "ghcr.io" ]; then
            namespace="$(printf '%s' "${namespace}" | tr '[:upper:]' '[:lower:]')"
          fi

          short_sha="$(printf '%s' "${COMMIT_SHA}" | cut -c1-12)"
          ref_type="${REF_TYPE}"
          ref_name="${REF_NAME}"

          if [ "$ref_type" = "tag" ] && printf '%s' "$ref_name" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$'; then
            version="${ref_name#v}"
            image_tags="${version},latest,sha-${short_sha}"
            chart_version="${version}"
          else
            version="sha-${short_sha}"
            image_tags="edge,sha-${short_sha}"
            chart_version="0.0.0-edge.${RUN_NUMBER}"
          fi

          {
            echo "registry=$registry"
            echo "namespace=$namespace"
            echo "image_tag=$version"
            echo "image_tags=$image_tags"
            echo "chart_version=$chart_version"
          } >> "$GITHUB_OUTPUT"

          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          selected_arches = ["amd64", "arm64"]

          rust_bundles = {
              "amd64": {
                  "arch": "amd64",
                  "runner_label": "ubuntu-24.04",
                  "service_rust_target": "x86_64-unknown-linux-gnu",
                  "service_target": "x86_64-unknown-linux-gnu.2.28",
                  "musl_target": "x86_64-unknown-linux-musl",
              },
              "arm64": {
                  "arch": "arm64",
                  "runner_label": "ubuntu-24.04",
                  "service_rust_target": "aarch64-unknown-linux-gnu",
                  "service_target": "aarch64-unknown-linux-gnu.2.28",
                  "musl_target": "aarch64-unknown-linux-musl",
              },
          }
          linux_packages = {
              "amd64": {
                  "arch": "amd64",
                  "runner_label": "ubuntu-24.04",
                  "nfpm_arch": "amd64",
                  "rpm_arch": "x86_64",
                  "pacman_arch": "x86_64",
              },
              "arm64": {
                  "arch": "arm64",
                  "runner_label": "ubuntu-24.04",
                  "nfpm_arch": "arm64",
                  "rpm_arch": "aarch64",
                  "pacman_arch": "aarch64",
              },
          }
          web_images = {
              "amd64": {"arch": "amd64", "runner_label": "ubuntu-24.04", "platform": "linux/amd64"},
              "arm64": {"arch": "arm64", "runner_label": "ubuntu-24.04", "platform": "linux/arm64"},
          }
          rust_image_templates = [
              {"name": "api", "repository": "attune/api", "source_path": "bin/attune-api", "dockerfile": "docker/Dockerfile.runtime"},
              {"name": "executor", "repository": "attune/executor", "source_path": "bin/attune-executor", "dockerfile": "docker/Dockerfile.runtime"},
              {"name": "notifier", "repository": "attune/notifier", "source_path": "bin/attune-notifier", "dockerfile": "docker/Dockerfile.runtime"},
              {"name": "supervisor", "repository": "attune/supervisor", "source_path": "bin/attune-supervisor", "dockerfile": "docker/Dockerfile.runtime"},
              {"name": "agent", "repository": "attune/agent", "source_path": "agent/attune-agent", "dockerfile": "docker/Dockerfile.agent-package"},
              {"name": "migrations", "repository": "attune/migrations", "source_path": "", "dockerfile": "docker/Dockerfile.migrations-package"},
              {"name": "init-user", "repository": "attune/init-user", "source_path": "", "dockerfile": "docker/Dockerfile.init-user-package"},
              {"name": "init-packs", "repository": "attune/init-packs", "source_path": "", "dockerfile": "docker/Dockerfile.init-packs-package"},
          ]

          def selected(mapping):
              return [mapping[arch] for arch in selected_arches]

          rust_images = []
          for arch in selected_arches:
              for image in rust_image_templates:
                  rust_images.append({
                      "arch": arch,
                      "runner_label": "ubuntu-24.04",
                      "platform": web_images[arch]["platform"],
                      "image": image,
                  })

          print(f"rust_bundle_matrix={json.dumps(selected(rust_bundles), separators=(',', ':'))}")
          print(f"linux_package_matrix={json.dumps(selected(linux_packages), separators=(',', ':'))}")
          print(f"rust_image_matrix={json.dumps(rust_images, separators=(',', ':'))}")
          print(f"web_image_matrix={json.dumps(selected(web_images), separators=(',', ':'))}")
          PY

  changes:
    name: Enable Release Publishers
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.release.outputs.rust }}
      helm: ${{ steps.release.outputs.helm }}
      web: ${{ steps.release.outputs.web }}
      docker_dist: ${{ steps.release.outputs.docker_dist }}
      linux_packages: ${{ steps.release.outputs.linux_packages }}
    steps:
      - name: Enable every release publisher
        id: release
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "rust=true"
            echo "helm=true"
            echo "web=true"
            echo "docker_dist=true"
            echo "linux_packages=true"
          } >> "$GITHUB_OUTPUT"

  build-rust-bundles:
    name: Build Rust Bundles (${{ matrix.arch }})
    runs-on: ${{ matrix.runner_label }}
    needs:
      - metadata
      - changes
    if: |
      needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.rust_bundle_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Rust toolchain
        uses: actions/cache@v5
        with:
          path: |
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-publish-${{ runner.os }}-${{ matrix.arch }}-stable-v1
          restore-keys: |
            rustup-${{ runner.os }}-${{ matrix.arch }}-stable-v1
            rustup-${{ runner.os }}-stable-v1
            rustup-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            ${{ matrix.service_rust_target }}
            ${{ matrix.musl_target }}

      - name: Cache Cargo registry + index
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-publish-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-publish-${{ matrix.arch }}-
            cargo-registry-

      - name: Cache Cargo build artifacts
        uses: actions/cache@v5
        with:
          path: target
          key: cargo-publish-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml') }}
          restore-keys: |
            cargo-publish-${{ matrix.arch }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-publish-${{ matrix.arch }}-

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev file binutils python3 python3-pip

      - name: Install Zig
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages --no-cache-dir ziglang
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-zigbuild >/dev/null 2>&1; then
            cargo install --locked cargo-zigbuild
          fi

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release \
            --target "${{ matrix.service_target }}" \
            --bin attune-api \
            --bin attune-executor \
            --bin attune-notifier \
            --bin attune-supervisor \
            --bin attune-worker \
            --bin attune-sensor

      - name: Verify minimum glibc requirement
        shell: bash
        run: |
          set -euo pipefail
          output_dir="target/${{ matrix.service_rust_target }}/release"

          get_min_glibc() {
            local file_path="$1"
            readelf -W --version-info --dyn-syms "$file_path" \
              | grep 'Name: GLIBC_' \
              | sed -E 's/.*GLIBC_([0-9.]+).*/\1/' \
              | sort -t . -k1,1n -k2,2n \
              | tail -n 1
          }

          version_gt() {
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n 1)" = "$1" ] && [ "$1" != "$2" ]
          }

          for binary in attune-api attune-executor attune-notifier attune-supervisor attune-worker attune-sensor; do
            min_glibc="$(get_min_glibc "${output_dir}/${binary}")"
            if [ -z "${min_glibc}" ]; then
              echo "Failed to determine glibc requirement for ${binary}"
              exit 1
            fi
            echo "${binary} requires glibc ${min_glibc}"
            if version_gt "${min_glibc}" "${GNU_GLIBC_VERSION}"; then
              echo "Expected ${binary} to require glibc <= ${GNU_GLIBC_VERSION}, got ${min_glibc}"
              exit 1
            fi
          done

      - name: Build static agent binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --release \
            --target "${{ matrix.musl_target }}" \
            --bin attune-agent \
            --bin attune-sensor-agent \
            --bin attune-mcp \
            --bin attune

      - name: Verify binary architecture
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.arch }}" in
            amd64) expected_pattern="x86-64" ;;
            arm64) expected_pattern="aarch64" ;;
            *)
              echo "Unsupported architecture: ${{ matrix.arch }}"
              exit 1
              ;;
          esac

          verify_arch() {
            local binary_path="$1"
            local description
            description="$(file "$binary_path")"
            echo "$description"
            if ! printf '%s' "$description" | grep -Eiq "$expected_pattern"; then
              echo "Expected $binary_path to be a ${{ matrix.arch }} binary matching '${expected_pattern}'"
              exit 1
            fi
          }

          service_output_dir="target/${{ matrix.service_rust_target }}/release"
          musl_output_dir="target/${{ matrix.musl_target }}/release"

          for binary in attune-api attune-executor attune-notifier attune-supervisor attune-worker attune-sensor; do
            verify_arch "${service_output_dir}/${binary}"
          done

          for binary in attune-agent attune-sensor-agent attune-mcp attune; do
            verify_arch "${musl_output_dir}/${binary}"
          done

      - name: Assemble binary bundle
        shell: bash
        env:
          BUNDLE_ARCH: ${{ matrix.arch }}
          SERVICE_RUST_TARGET: ${{ matrix.service_rust_target }}
          MUSL_TARGET: ${{ matrix.musl_target }}
          COMMIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
        run: |
          set -euo pipefail

          bundle_root="dist/bundle/${BUNDLE_ARCH}"
          service_output_dir="target/${SERVICE_RUST_TARGET}/release"
          mkdir -p "$bundle_root/bin" "$bundle_root/agent"

          cp "${service_output_dir}/attune-api" "$bundle_root/bin/"
          cp "${service_output_dir}/attune-executor" "$bundle_root/bin/"
          cp "${service_output_dir}/attune-notifier" "$bundle_root/bin/"
          cp "${service_output_dir}/attune-supervisor" "$bundle_root/bin/"
          cp "${service_output_dir}/attune-worker" "$bundle_root/bin/"
          cp "${service_output_dir}/attune-sensor" "$bundle_root/bin/"
          cp "target/${MUSL_TARGET}/release/attune-agent" "$bundle_root/agent/"
          cp "target/${MUSL_TARGET}/release/attune-sensor-agent" "$bundle_root/agent/"
          cp "target/${MUSL_TARGET}/release/attune-mcp" "$bundle_root/agent/"
          cp "target/${MUSL_TARGET}/release/attune" "$bundle_root/agent/"

          cat > "$bundle_root/metadata.json" <<EOF
          {
            "git_sha": "${COMMIT_SHA}",
            "ref": "${GIT_REF}",
            "arch": "${BUNDLE_ARCH}",
            "image_tag": "${IMAGE_TAG}"
          }
          EOF

          tar -C "dist/bundle/${BUNDLE_ARCH}" -czf "dist/attune-binaries-${BUNDLE_ARCH}.tar.gz" .

      - name: Upload binary bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: attune-binaries-${{ matrix.arch }}
          path: dist/attune-binaries-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Attach binary bundle to GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BUNDLE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          asset_path="dist/attune-binaries-${BUNDLE_ARCH}.tar.gz"

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            release_args=(--title "$TAG_NAME" --verify-tag)
            if [[ "$TAG_NAME" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            if ! gh release create "$TAG_NAME" "${release_args[@]}"; then
              gh release view "$TAG_NAME" >/dev/null 2>&1
            fi
          fi

          gh release upload "$TAG_NAME" "$asset_path" --clobber

  build-macos-cli:
    name: Build macOS CLI (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_version="${TAG_NAME#v}"
          export expected_version

          cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import os
          import sys

          metadata = json.load(sys.stdin)
          package = next(item for item in metadata["packages"] if item["name"] == "attune-cli")
          expected = os.environ["expected_version"]
          actual = package["version"]
          if actual != expected:
              raise SystemExit(
                  f"attune-cli version {actual} does not match release tag {expected}"
              )
          '

      - name: Build CLI binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --package attune-cli --bins
          ./target/release/attune --version
          ./target/release/attune-mcp --version

      - name: Import Developer ID certificate
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64" ] || [ -z "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" ]; then
            echo "Set APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64 and APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD to sign macOS release binaries."
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/attune-developer-id-${ARCH}.p12"
          keychain_path="$RUNNER_TEMP/attune-signing-${ARCH}.keychain-db"
          keychain_password="$(uuidgen)"

          {
            echo "MACOS_SIGNING_CERTIFICATE_PATH=$certificate_path"
            echo "MACOS_SIGNING_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"

          printf '%s' "$APPLE_DEVELOPER_ID_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"

          identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -F '"' '/Developer ID Application:/ { print $2; exit }'
          )"
          if [ -z "$identity" ]; then
            echo "The imported certificate does not contain a Developer ID Application signing identity."
            exit 1
          fi

          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign macOS CLI binaries
        shell: bash
        run: |
          set -euo pipefail

          for binary in attune attune-mcp; do
            binary_path="target/release/${binary}"
            codesign \
              --force \
              --keychain "$MACOS_SIGNING_KEYCHAIN" \
              --options runtime \
              --sign "$MACOS_SIGNING_IDENTITY" \
              --timestamp \
              "$binary_path"
            codesign --verify --strict --verbose=2 "$binary_path"
          done

      - name: Notarize macOS CLI binaries
        shell: bash
        env:
          APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_P8_BASE64 }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_NOTARY_KEY_ID" ] || [ -z "$APPLE_NOTARY_ISSUER_ID" ] || [ -z "$APPLE_NOTARY_PRIVATE_KEY_P8_BASE64" ]; then
            echo "Set APPLE_NOTARY_KEY_ID, APPLE_NOTARY_ISSUER_ID, and APPLE_NOTARY_PRIVATE_KEY_P8_BASE64 to notarize macOS release binaries."
            exit 1
          fi

          stage_dir="$RUNNER_TEMP/attune-macos-notary-${ARCH}"
          notary_key_path="$RUNNER_TEMP/AuthKey_${APPLE_NOTARY_KEY_ID}.p8"
          notarization_archive="$RUNNER_TEMP/attune-macos-notary-${ARCH}.zip"

          rm -rf "$stage_dir" "$notarization_archive"
          mkdir -p "$stage_dir"
          install -m 0755 target/release/attune "$stage_dir/attune"
          install -m 0755 target/release/attune-mcp "$stage_dir/attune-mcp"
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY_P8_BASE64" | base64 -D > "$notary_key_path"
          chmod 600 "$notary_key_path"

          ditto -c -k --keepParent "$stage_dir" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --key "$notary_key_path" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait

          for binary in attune attune-mcp; do
            spctl --assess --type execute --verbose=4 "target/release/${binary}"
          done

      - name: Package macOS CLI archive
        id: package
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          archive="attune_${version}_darwin_${ARCH}.tar.gz"
          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT

          install -m 0755 target/release/attune "$stage_dir/attune"
          install -m 0755 target/release/attune-mcp "$stage_dir/attune-mcp"
          install -m 0644 LICENSE "$stage_dir/LICENSE"

          mkdir -p dist
          tar -C "$stage_dir" -czf "dist/${archive}" attune attune-mcp LICENSE
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: attune-macos-cli-${{ matrix.arch }}
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach macOS CLI archive to GitHub release
        shell: bash
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            release_args=(--title "$TAG_NAME" --verify-tag)
            if [[ "$TAG_NAME" == *-* ]]; then
              release_args+=(--prerelease)
            fi
            if ! gh release create "$TAG_NAME" "${release_args[@]}"; then
              gh release view "$TAG_NAME" >/dev/null 2>&1
            fi
          fi

          gh release upload "$TAG_NAME" \
            "dist/${ARCHIVE}" \
            "dist/${ARCHIVE}.sha256" \
            --clobber

      - name: Remove macOS signing credentials
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MACOS_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "${MACOS_SIGNING_CERTIFICATE_PATH:-}" \
            "$RUNNER_TEMP"/AuthKey_*.p8

  build-windows-cli:
    name: Build Windows CLI (amd64)
    runs-on: windows-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedVersion = $env:TAG_NAME.Substring(1)
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'attune-cli' }

          if ($null -eq $package -or $package.version -ne $expectedVersion) {
            throw "attune-cli version does not match release tag $env:TAG_NAME"
          }

      - name: Build CLI binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --locked --release --package attune-cli --bins
          .\target\release\attune.exe --version
          .\target\release\attune-mcp.exe --version

      - name: Package Windows CLI archive
        id: package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          $version = $env:TAG_NAME.Substring(1)
          $archive = "attune_${version}_windows_amd64.zip"
          $stageDir = Join-Path $env:RUNNER_TEMP 'attune-windows-cli'
          $archivePath = Join-Path 'dist' $archive

          Remove-Item -Recurse -Force $stageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          New-Item -ItemType Directory -Path 'dist' -Force | Out-Null
          Copy-Item 'target\release\attune.exe' $stageDir
          Copy-Item 'target\release\attune-mcp.exe' $stageDir
          Copy-Item 'LICENSE' $stageDir
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $archivePath -Force

          $sha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "{0}  {1}" -f $sha256, $archive | Set-Content -Path "${archivePath}.sha256" -Encoding ascii
          "archive=$archive" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v7
        with:
          name: attune-windows-cli-amd64
          path: |
            dist/${{ steps.package.outputs.archive }}
            dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Attach Windows CLI archive to GitHub release
        shell: pwsh
        env:
          ARCHIVE: ${{ steps.package.outputs.archive }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          gh release view $env:TAG_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArgs = @($env:TAG_NAME, '--title', $env:TAG_NAME, '--verify-tag')
            if ($env:TAG_NAME -like '*-*') {
              $releaseArgs += '--prerelease'
            }

            gh release create @releaseArgs
            if ($LASTEXITCODE -ne 0) {
              gh release view $env:TAG_NAME *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "Unable to create or find GitHub release $env:TAG_NAME"
              }
            }
          }

          gh release upload $env:TAG_NAME `
            "dist\$($env:ARCHIVE)" `
            "dist\$($env:ARCHIVE).sha256" `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload Windows CLI release assets"
          }

  publish-chocolatey:
    name: Publish Chocolatey Package
    runs-on: windows-latest
    needs: build-windows-cli
    if: github.ref_type == 'tag'
    concurrency:
      group: chocolatey-package-${{ github.repository }}
      cancel-in-progress: false
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check stable release version
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:TAG_NAME.Substring(1)

          if ($version -match '^\d+\.\d+\.\d+$') {
            'stable=true' | Add-Content -Path $env:GITHUB_OUTPUT
            "version=$version" | Add-Content -Path $env:GITHUB_OUTPUT
          } else {
            'stable=false' | Add-Content -Path $env:GITHUB_OUTPUT
            Write-Host "Skipping Chocolatey publication for pre-release tag $env:TAG_NAME"
          }

      - name: Explain skipped Chocolatey publication
        if: steps.release.outputs.stable != 'true' || env.CHOCOLATEY_API_KEY == ''
        shell: pwsh
        run: |
          if ('${{ steps.release.outputs.stable }}' -ne 'true') {
            Write-Host 'Only stable vX.Y.Z tags publish the Chocolatey package.'
          } else {
            Write-Host 'CHOCOLATEY_API_KEY is not configured; the Windows archive was released but Chocolatey was not updated.'
          }

      - name: Download Windows CLI archive
        if: steps.release.outputs.stable == 'true' && env.CHOCOLATEY_API_KEY != ''
        uses: actions/download-artifact@v7
        with:
          name: attune-windows-cli-amd64
          path: dist/artifacts

      - name: Build and publish Chocolatey package
        if: steps.release.outputs.stable == 'true' && env.CHOCOLATEY_API_KEY != ''
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = "attune_$($env:VERSION)_windows_amd64.zip"
          $checksum = (Get-Content -Path "dist\artifacts\$archive.sha256" -Raw).Split()[0]
          $packageDir = Join-Path $env:RUNNER_TEMP 'attune-chocolatey'

          Copy-Item -Recurse 'packaging\chocolatey' $packageDir
          $installScriptPath = Join-Path $packageDir 'tools\chocolateyInstall.ps1'
          $nuspecPath = Join-Path $packageDir 'attune-cli.nuspec'

          $installScript = Get-Content -Path "${installScriptPath}.in" -Raw
          $installScript = $installScript.Replace('__REPOSITORY__', $env:GITHUB_REPOSITORY)
          $installScript = $installScript.Replace('__VERSION__', $env:VERSION)
          $installScript = $installScript.Replace('__SHA256__', $checksum)
          Set-Content -Path $installScriptPath -Value $installScript -Encoding utf8
          Remove-Item "${installScriptPath}.in"

          $nuspec = (Get-Content -Path $nuspecPath -Raw).Replace('__VERSION__', $env:VERSION)
          Set-Content -Path $nuspecPath -Value $nuspec -Encoding utf8

          Push-Location $packageDir
          try {
            choco pack attune-cli.nuspec --limit-output
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to pack Chocolatey package'
            }

            choco push "attune-cli.$env:VERSION.nupkg" `
              --source 'https://push.chocolatey.org/' `
              --api-key $env:CHOCOLATEY_API_KEY `
              --limit-output
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to publish Chocolatey package'
            }
          } finally {
            Pop-Location
          }

  publish-homebrew-cask:
    name: Publish Homebrew Cask
    runs-on: ubuntu-24.04
    needs: build-macos-cli
    if: github.ref_type == 'tag'
    concurrency:
      group: homebrew-cask-${{ github.repository }}
      cancel-in-progress: false
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPOSITORY: attune-system/attune-client-homebrew-tap
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Check stable release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Homebrew cask update for pre-release tag ${TAG_NAME}"
          fi

      - name: Explain skipped Homebrew cask update
        if: steps.release.outputs.stable != 'true' || env.HOMEBREW_TAP_TOKEN == ''
        shell: bash
        run: |
          if [ "${{ steps.release.outputs.stable }}" != "true" ]; then
            echo "Only stable vX.Y.Z tags update the Homebrew cask."
          else
            echo "HOMEBREW_TAP_TOKEN is not configured; macOS archives were released but the tap was not updated."
          fi

      - name: Download macOS CLI archives
        if: steps.release.outputs.stable == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/download-artifact@v7
        with:
          pattern: attune-macos-cli-*
          merge-multiple: true

      - name: Check out Homebrew tap
        if: steps.release.outputs.stable == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update and publish cask
        if: steps.release.outputs.stable == 'true' && env.HOMEBREW_TAP_TOKEN != ''
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          arm_archive="attune_${VERSION}_darwin_arm64.tar.gz"
          intel_archive="attune_${VERSION}_darwin_amd64.tar.gz"
          arm_sha256="$(awk '{print $1}' "${arm_archive}.sha256")"
          intel_sha256="$(awk '{print $1}' "${intel_archive}.sha256")"

          python3 homebrew-tap/.github/scripts/update_attune_cask.py \
            --version "$VERSION" \
            --arm-sha256 "$arm_sha256" \
            --intel-sha256 "$intel_sha256" \
            --output homebrew-tap/Casks/attune.rb

          ruby -c homebrew-tap/Casks/attune.rb

          cd homebrew-tap
          git add Casks/attune.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "attune ${VERSION}"
          git push origin HEAD:main

  publish-linux-packages:
    name: Publish Linux Packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner_label }}
    needs:
      - metadata
      - changes
      - build-rust-bundles
    if: |
      needs.changes.outputs.linux_packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.linux_package_matrix) }}
    concurrency:
      group: linux-package-repo-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download binary bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: attune-binaries-${{ matrix.arch }}
          path: dist/artifacts

      - name: Extract binary bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/bundle
          tar -xzf "dist/artifacts/attune-binaries-${{ matrix.arch }}.tar.gz" -C dist/bundle
          echo "Bundle contents:"
          find dist/bundle -type f | sort

      - name: Install nfpm
        shell: bash
        run: |
          set -euo pipefail

          NFPM_VERSION="2.41.1"
          case "$(uname -m)" in
            x86_64) NFPM_ARCH="x86_64" ;;
            aarch64) NFPM_ARCH="arm64" ;;
          esac
          curl -sLo /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_ARCH}.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo mv /tmp/nfpm /usr/local/bin/nfpm
          rm -f /tmp/nfpm.tar.gz
          nfpm --version

      - name: Resolve version
        id: version
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.metadata.outputs.image_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail

          # Use image_tag for version (strips leading 'v' for release tags).
          version="${IMAGE_TAG#v}"
          # Linux package managers require versions to start with a digit, and
          # branch builds also need monotonic upgrade ordering. Keep release tags
          # unchanged, but turn SHA image tags into ordered package versions like
          # 0.0.0.git.123.sha.abc123.
          version="$(printf '%s' "$version" | sed 's/[^0-9A-Za-z.+~]/./g')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]'; then
            version="0.0.0.git.${RUN_NUMBER}.${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version"

      - name: Build packages
        shell: bash
        env:
          BUNDLE_DIR: ${{ github.workspace }}/dist/bundle
          ARCH: ${{ matrix.nfpm_arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/build-linux-packages.sh "$BUNDLE_DIR" "$ARCH" "$VERSION"

      - name: Publish Linux packages to Nexus
        shell: bash
        env:
          DEB_ARCH: ${{ matrix.nfpm_arch }}
          RPM_ARCH: ${{ matrix.rpm_arch }}
          PACMAN_ARCH: ${{ matrix.pacman_arch }}
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_APT_REPOSITORY: ${{ vars.NEXUS_APT_REPOSITORY }}
          NEXUS_YUM_REPOSITORY: ${{ vars.NEXUS_YUM_REPOSITORY }}
          NEXUS_RAW_REPOSITORY: ${{ vars.NEXUS_RAW_REPOSITORY }}
          NEXUS_APT_COMPONENT: ${{ vars.NEXUS_APT_COMPONENT }}
        run: |
          set -euo pipefail

          : "${NEXUS_URL:?Set repository variable NEXUS_URL}"
          : "${NEXUS_USERNAME:?Set secret NEXUS_USERNAME}"
          : "${NEXUS_PASSWORD:?Set secret NEXUS_PASSWORD}"

          nexus_base="${NEXUS_URL%/}"
          apt_repo="${NEXUS_APT_REPOSITORY:-attune-apt}"
          yum_repo="${NEXUS_YUM_REPOSITORY:-attune-yum}"
          raw_repo="${NEXUS_RAW_REPOSITORY:-}"
          apt_component="${NEXUS_APT_COMPONENT:-main}"

          upload_package() {
            local repository="$1"
            local destination_path="$2"
            local package_file="$3"

            echo "Uploading $(basename "$package_file") to Nexus repository ${repository}/${destination_path}"
            curl --fail --show-error --silent \
              --retry 5 \
              --retry-delay 2 \
              --retry-all-errors \
              --user "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
              --upload-file "$package_file" \
              "${nexus_base}/repository/${repository}/${destination_path}"
          }

          for package_file in dist/packages/*.deb; do
            [ -f "$package_file" ] || continue
            upload_package "$apt_repo" "pool/${apt_component}/${DEB_ARCH}/$(basename "$package_file")" "$package_file"
          done

          for package_file in dist/packages/*.rpm; do
            [ -f "$package_file" ] || continue
            upload_package "$yum_repo" "${RPM_ARCH}/$(basename "$package_file")" "$package_file"
          done

          if [ -n "$raw_repo" ]; then
            for package_file in dist/packages/*.pkg.tar.zst; do
              [ -f "$package_file" ] || continue
              upload_package "$raw_repo" "archlinux/${PACMAN_ARCH}/$(basename "$package_file")" "$package_file"
            done
          else
            echo "NEXUS_RAW_REPOSITORY is not set; skipping Arch Linux package upload"
          fi

  publish-docker-dist:
    name: Publish Docker Dist Bundle
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - changes
    if: needs.changes.outputs.docker_dist == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build docker dist bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package-docker-dist.sh docker/distributable artifacts/attune-docker-dist.tar.gz

      - name: Upload docker dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: attune-docker-dist
          path: artifacts/attune-docker-dist.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Attach docker dist archive to release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          api_base="https://api.github.com"
          upload_api_base="https://uploads.github.com"
          auth_header="Authorization: Bearer ${GITHUB_TOKEN}"
          accept_header="Accept: application/vnd.github+json"
          api_version_header="X-GitHub-Api-Version: 2022-11-28"
          owner_repo="${OWNER_REPO}"
          tag_name="${TAG_NAME}"
          archive_path="artifacts/attune-docker-dist.tar.gz"
          asset_name="attune-docker-dist-${tag_name}.tar.gz"

          release_response_file="$(mktemp)"
          status_code="$(curl -sS -o "${release_response_file}" -w '%{http_code}' \
            -H "${auth_header}" \
            -H "${accept_header}" \
            -H "${api_version_header}" \
            "${api_base}/repos/${owner_repo}/releases/tags/${tag_name}")"

          if [ "${status_code}" = "404" ]; then
            create_payload="$(TAG_NAME="${tag_name}" python3 - <<'PY'
          import json
          import os

          tag = os.environ["TAG_NAME"]
          print(json.dumps({
              "tag_name": tag,
              "name": tag,
              "draft": False,
              "prerelease": "-" in tag,
          }))
          PY
          )"

            status_code="$(curl -sS -o "${release_response_file}" -w '%{http_code}' \
              -H "${auth_header}" \
              -H "${accept_header}" \
              -H "${api_version_header}" \
              -H "Content-Type: application/json" \
              -X POST \
              -d "${create_payload}" \
              "${api_base}/repos/${owner_repo}/releases")"

            if [ "${status_code}" = "422" ]; then
              status_code="$(curl -sS -o "${release_response_file}" -w '%{http_code}' \
                -H "${auth_header}" \
                -H "${accept_header}" \
                -H "${api_version_header}" \
                "${api_base}/repos/${owner_repo}/releases/tags/${tag_name}")"
            fi
          fi

          case "${status_code}" in
            200|201)
              ;;
            *)
              echo "Failed to fetch or create release for tag ${tag_name}"
              cat "${release_response_file}"
              exit 1
              ;;
          esac

          release_id="$(python3 - "${release_response_file}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              data = json.load(fh)
          print(data["id"])
          PY
          )"

          existing_asset_id="$(python3 - "${release_response_file}" "${asset_name}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              data = json.load(fh)
          name = sys.argv[2]
          for asset in data.get("assets", []):
              if asset.get("name") == name:
                  print(asset["id"])
                  break
          PY
          )"

          if [ -n "${existing_asset_id}" ]; then
            curl -sS \
              -H "${auth_header}" \
              -H "${accept_header}" \
              -H "${api_version_header}" \
              -X DELETE \
              "${api_base}/repos/${owner_repo}/releases/assets/${existing_asset_id}" \
              >/dev/null
          fi

          encoded_asset_name="$(ASSET_NAME="${asset_name}" python3 - <<'PY'
          import os
          import urllib.parse

          print(urllib.parse.quote(os.environ["ASSET_NAME"], safe=""))
          PY
          )"

          upload_response_file="$(mktemp)"
          status_code="$(curl -sS -o "${upload_response_file}" -w '%{http_code}' \
            -H "${auth_header}" \
            -H "${accept_header}" \
            -H "${api_version_header}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@${archive_path}" \
            "${upload_api_base}/repos/${owner_repo}/releases/${release_id}/assets?name=${encoded_asset_name}")"

          case "${status_code}" in
            201)
              ;;
            *)
              echo "Failed to upload release asset ${asset_name}"
              cat "${upload_response_file}"
              exit 1
              ;;
          esac

  publish-helm-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - changes
    timeout-minutes: 10
    if: needs.changes.outputs.helm == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache Helm binary
        id: cache-helm
        uses: actions/cache@v5
        with:
          path: ~/.cache/attune/helm/4.1.4
          key: helm-v4.1.4-linux-amd64

      - name: Install Helm
        shell: bash
        run: |
          set -euo pipefail
          helm_bin="$HOME/.cache/attune/helm/4.1.4/helm"

          if [ ! -x "$helm_bin" ]; then
            echo "Cache miss - downloading Helm v4.1.4"
            mkdir -p "$HOME/.cache/attune/helm/4.1.4"
            curl -fsSL \
              -o /tmp/helm.tar.gz \
              "https://get.helm.sh/helm-v4.1.4-linux-amd64.tar.gz"
            tar -xzf /tmp/helm.tar.gz -C /tmp
            mv /tmp/linux-amd64/helm "$helm_bin"
            chmod +x "$helm_bin"
          else
            echo "Cache hit — using cached Helm v4.1.4"
          fi

          sudo ln -sf "$helm_bin" /usr/local/bin/helm
          helm version

      - name: Package Helm chart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/helm
          helm package charts/attune \
            --version "${{ needs.metadata.outputs.chart_version }}" \
            --app-version "${{ needs.metadata.outputs.image_tag }}" \
            --destination dist/helm

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v7
        with:
          name: attune-helm-chart
          path: dist/helm/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish Helm chart package
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          registry_username="${REGISTRY_USERNAME:-${GITHUB_ACTOR_NAME}}"
          registry_password="${REGISTRY_PASSWORD:-${GITHUB_TOKEN_FALLBACK:-}}"

          if [ -z "${registry_password}" ]; then
            echo "Set CONTAINER_REGISTRY_PASSWORD or enable GITHUB_TOKEN package writes"
            exit 1
          fi

          package_file="dist/helm/attune-${{ needs.metadata.outputs.chart_version }}.tgz"
          chart_repository="oci://${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.namespace }}/attune/charts"

          echo "Publishing Helm chart to GHCR"
          echo "  chart_version: ${{ needs.metadata.outputs.chart_version }}"
          echo "  app_version: ${{ needs.metadata.outputs.image_tag }}"
          echo "  chart_repository: ${chart_repository}"
          echo "  package_file: ${package_file}"

          printf '%s' "${registry_password}" \
            | helm registry login "${{ needs.metadata.outputs.registry }}" \
              --username "${registry_username}" \
              --password-stdin
          helm push "${package_file}" "${chart_repository}"

  publish-rust-images:
    name: Publish ${{ matrix.image.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner_label }}
    needs:
      - metadata
      - changes
      - build-rust-bundles
    if: |
      needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.rust_image_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          registry_username="${REGISTRY_USERNAME:-${GITHUB_ACTOR_NAME}}"
          registry_password="${REGISTRY_PASSWORD:-${GITHUB_TOKEN_FALLBACK:-}}"

          if [ -z "$registry_password" ]; then
            echo "Set CONTAINER_REGISTRY_PASSWORD or enable GITHUB_TOKEN package writes"
            exit 1
          fi

          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$registry_username" "$registry_password" | base64 | tr -d '\n')"

          cat > "$HOME/.docker/config.json" <<EOF
          {
            "auths": {
              "${{ needs.metadata.outputs.registry }}": {
                "auth": "${auth}"
              }
            }
          }
          EOF

      - name: Download binary bundle artifact
        uses: actions/download-artifact@v8
        with:
          name: attune-binaries-${{ matrix.arch }}
          path: dist/artifact

      - name: Extract binary bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "dist/artifact/attune-binaries-${{ matrix.arch }}.tar.gz" -C dist/artifact

      - name: Prepare packaging context
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist/image
          mkdir -p dist/image

          echo "Preparing packaging context"
          echo "  image: ${{ matrix.image.name }}"
          echo "  repository: ${{ matrix.image.repository }}"
          echo "  source_path: ${{ matrix.image.source_path }}"
          echo "  dockerfile: ${{ matrix.image.dockerfile }}"

          case "${{ matrix.image.name }}" in
            api|executor|notifier|supervisor)
              cp "dist/artifact/${{ matrix.image.source_path }}" dist/attune-service-binary
              ;;
            agent)
              cp dist/artifact/agent/attune-agent dist/attune-agent
              cp dist/artifact/agent/attune-sensor-agent dist/attune-sensor-agent
              cp dist/artifact/agent/attune-mcp dist/attune-mcp
              cp dist/artifact/agent/attune dist/attune
              ;;
            migrations|init-user|init-packs)
              ;;
            *)
              echo "Unsupported image: ${{ matrix.image.name }}"
              exit 1
              ;;
          esac

      - name: Push architecture image
        shell: bash
        run: |
          set -euo pipefail

          run_with_retries() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${attempt} attempts: $*"
                return 1
              fi

              echo "Command failed on attempt ${attempt}/${max_attempts}: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          image_ref="${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.namespace }}/${{ matrix.image.repository }}:${{ needs.metadata.outputs.image_tag }}-${{ matrix.arch }}"

          build_cmd=(
            docker buildx build
            .
            --platform "${{ matrix.platform }}"
            --file "${{ matrix.image.dockerfile }}"
            --provenance=false
            --sbom=false
          )

          build_cmd+=(--tag "$image_ref" --push)

          echo "Publishing architecture image"
          echo "  image: ${{ matrix.image.name }}"
          echo "  repository: ${{ matrix.image.repository }}"
          echo "  platform: ${{ matrix.platform }}"
          echo "  dockerfile: ${{ matrix.image.dockerfile }}"
          echo "  destination: ${image_ref}"

          run_with_retries 3 5 "${build_cmd[@]}"

  publish-web-images:
    name: Publish web (${{ matrix.arch }})
    runs-on: ${{ matrix.runner_label }}
    needs:
      - metadata
      - changes
    if: |
      needs.changes.outputs.web == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.web_image_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure OCI registry auth
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          username="${REGISTRY_USERNAME:-${GITHUB_ACTOR_NAME}}"
          password="${REGISTRY_PASSWORD:-${GITHUB_TOKEN_FALLBACK:-}}"

          if [ -z "$password" ]; then
            echo "Set CONTAINER_REGISTRY_PASSWORD or enable GITHUB_TOKEN package writes"
            exit 1
          fi

          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$username" "$password" | base64 | tr -d '\n')"

          cat > "$HOME/.docker/config.json" <<EOF
          {
            "auths": {
              "${{ needs.metadata.outputs.registry }}": {
                "auth": "${auth}"
              }
            }
          }
          EOF

      - name: Push architecture image
        shell: bash
        run: |
          set -euo pipefail

          run_with_retries() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${attempt} attempts: $*"
                return 1
              fi

              echo "Command failed on attempt ${attempt}/${max_attempts}: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          image_ref="${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.namespace }}/attune/web:${{ needs.metadata.outputs.image_tag }}-${{ matrix.arch }}"

          build_cmd=(
            docker buildx build
            .
            --platform "${{ matrix.platform }}"
            --file docker/Dockerfile.web
            --provenance=false
            --sbom=false
          )

          build_cmd+=(--tag "$image_ref" --push)

          echo "Publishing architecture image"
          echo "  image: web"
          echo "  repository: attune/web"
          echo "  platform: ${{ matrix.platform }}"
          echo "  dockerfile: docker/Dockerfile.web"
          echo "  destination: ${image_ref}"

          run_with_retries 3 5 "${build_cmd[@]}"

  publish-manifests:
    name: Publish manifest ${{ matrix.repository }}
    runs-on: ubuntu-24.04
    needs:
      - metadata
      - changes
      - publish-rust-images
      - publish-web-images
    if: |
      !cancelled() &&
      (needs.publish-web-images.result == 'success' || needs.publish-rust-images.result == 'success') &&
      (needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true')
    strategy:
      fail-fast: false
      matrix:
        repository:
          - attune/api
          - attune/executor
          - attune/notifier
          - attune/supervisor
          - attune/agent
          - attune/migrations
          - attune/init-user
          - attune/init-packs
          - attune/web
    steps:
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure OCI registry auth
        shell: bash
        env:
          REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}
          GITHUB_TOKEN_FALLBACK: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
        run: |
          set -euo pipefail
          username="${REGISTRY_USERNAME:-${GITHUB_ACTOR_NAME}}"
          password="${REGISTRY_PASSWORD:-${GITHUB_TOKEN_FALLBACK:-}}"

          if [ -z "$password" ]; then
            echo "Set CONTAINER_REGISTRY_PASSWORD or enable GITHUB_TOKEN package writes"
            exit 1
          fi

          mkdir -p "$HOME/.docker"
          auth="$(printf '%s:%s' "$username" "$password" | base64 | tr -d '\n')"

          cat > "$HOME/.docker/config.json" <<EOF
          {
            "auths": {
              "${{ needs.metadata.outputs.registry }}": {
                "auth": "${auth}"
              }
            }
          }
          EOF

      - name: Publish manifest tags
        shell: bash
        run: |
          set -euo pipefail
          rust_result="${{ needs.publish-rust-images.result }}"
          web_result="${{ needs.publish-web-images.result }}"

          if [ "${{ matrix.repository }}" = "attune/web" ] && [ "$web_result" != "success" ]; then
            echo "Skipping web manifest because web image publishing result is ${web_result}"
            exit 0
          fi
          if [ "${{ matrix.repository }}" != "attune/web" ] && [ "$rust_result" != "success" ]; then
            echo "Skipping ${{ matrix.repository }} manifest because Rust image publishing result is ${rust_result}"
            exit 0
          fi

          run_with_retries() {
            local max_attempts="$1"
            local delay_seconds="$2"
            shift 2

            local attempt=1
            while true; do
              if "$@"; then
                return 0
              fi

              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "Command failed after ${attempt} attempts: $*"
                return 1
              fi

              echo "Command failed on attempt ${attempt}/${max_attempts}: $*"
              echo "Retrying in ${delay_seconds}s..."
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
            done
          }

          image_base="${{ needs.metadata.outputs.registry }}/${{ needs.metadata.outputs.namespace }}/${{ matrix.repository }}"

          IFS=',' read -ra tags <<< "${{ needs.metadata.outputs.image_tags }}"
          for tag in "${tags[@]}"; do
            manifest_ref="${image_base}:${tag}"
            amd64_ref="${image_base}:${{ needs.metadata.outputs.image_tag }}-amd64"
            arm64_ref="${image_base}:${{ needs.metadata.outputs.image_tag }}-arm64"

            if [ "${{ matrix.repository }}" = "attune/web" ]; then
              echo "Publishing multi-arch manifest with docker manifest"
              echo "  repository: ${{ matrix.repository }}"
              echo "  manifest_tag: ${tag}"
              echo "  manifest_ref: ${manifest_ref}"
              echo "  source_amd64: ${amd64_ref}"
              echo "  source_arm64: ${arm64_ref}"
              docker manifest rm "$manifest_ref" >/dev/null 2>&1 || true
              run_with_retries 3 5 \
                docker manifest create "$manifest_ref" "$amd64_ref" "$arm64_ref"
              docker manifest annotate "$manifest_ref" "$amd64_ref" --os linux --arch amd64
              docker manifest annotate "$manifest_ref" "$arm64_ref" --os linux --arch arm64
              run_with_retries 3 5 \
                docker manifest push "$manifest_ref"
            else
              echo "Publishing multi-arch manifest with buildx imagetools"
              echo "  repository: ${{ matrix.repository }}"
              echo "  manifest_tag: ${tag}"
              echo "  manifest_ref: ${manifest_ref}"
              echo "  source_amd64: ${amd64_ref}"
              echo "  source_arm64: ${arm64_ref}"
              run_with_retries 3 5 \
                docker buildx imagetools create \
                --tag "$manifest_ref" \
                "$amd64_ref" \
                "$arm64_ref"
            fi
          done
