name: Workload Isolation
on:
  pull_request:
    paths:
      - 'crates/common/src/workload_sandbox.rs'
      - 'crates/common/src/workload_archive.rs'
      - 'crates/common/src/workload_launch.rs'
      - 'crates/launch-controller/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/workload-sandbox-harness/**'
      - '.github/workflows/workload-isolation.yml'
      - 'scripts/ci-workload-isolation-prerequisites.sh'
      - 'docker/Dockerfile.workload-runtime'
      - 'docker-compose.yaml'
      - 'scripts/test-workload-runtime-images.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-boundary:
    name: Linux host workload boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install and record real prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc strace apparmor-utils
          bwrap --version
          bwrap --help | grep -- --disable-userns
          uname -a
      - name: Diagnose and load only the distro Bubblewrap userns policy
        run: bash scripts/ci-workload-isolation-prerequisites.sh
      - name: Run real production boundary tests (missing prerequisites fail)
        if: ${{ always() }}
        env:
          ATTUNE_TEST_RUN_ID: boundary-${{ github.run_id }}
        run: cargo test --locked --manifest-path tests/workload-sandbox-harness/Cargo.toml -- --include-ignored --test-threads=4
      - name: Preserve kernel and prerequisite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workload-isolation-prerequisites
          path: ${{ runner.temp }}/attune-workload-prerequisites
          if-no-files-found: error
  runtime-images:
    name: All configured workload runtime images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Build and verify shell, Python, Node, full and sensor images
        run: python3 scripts/test-workload-runtime-images.py
  docker-controller-boundary:
    name: Docker controller boundary primitives
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      ATTUNE_TEST_RUN_ID: docker-controller
      ATTUNE_TEST_DOCKER_SOCKET: /var/run/docker.sock
      ATTUNE_TEST_LAUNCH_IMAGE: debian@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Record ordinary Engine policy and pull immutable owned-test image
        run: |
          docker version
          docker info --format '{{json .SecurityOptions}}'
          docker pull "$ATTUNE_TEST_LAUNCH_IMAGE"
      - name: Run actual controller modules and real Engine test (no skips)
        run: cargo test --locked -p attune-launch-controller --lib -- --include-ignored --nocapture --test-threads=4
