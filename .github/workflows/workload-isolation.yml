name: Workload Isolation
on:
  pull_request:
    paths:
      - 'crates/common/src/workload_sandbox.rs'
      - 'crates/common/src/workload_archive.rs'
      - 'crates/common/src/workload_launch.rs'
      - 'crates/common/src/workload_launch_io.rs'
      - 'crates/common/src/workload_session.rs'
      - 'crates/common/src/workload_artifact.rs'
      - 'crates/worker/src/runtime/launch_planning.rs'
      - 'crates/worker/src/workload_runner_main.rs'
      - 'crates/worker/Cargo.toml'
      - 'crates/core-actions/**'
      - 'crates/launch-controller/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'tests/workload-sandbox-harness/**'
      - '.github/workflows/workload-isolation.yml'
      - 'scripts/ci-workload-isolation-prerequisites.sh'
      - 'docker/Dockerfile.workload-runtime'
      - 'docker-compose.yaml'
      - 'docker-compose.workload-host.yaml'
      - 'docker/workload-launch-proxy.conf'
      - 'scripts/generate-workload-controller-config.py'
      - 'scripts/test-workload-controller-compose.py'
      - 'scripts/test-workload-controller-project.py'
      - 'scripts/test-workload-runtime-images.py'
      - 'scripts/test-launch-controller-container.py'
      - 'scripts/test-workload-runner.py'
      - 'scripts/test_native_http_action.py'
      - 'docker/Dockerfile.agent'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controller-config:
    name: External controller configuration contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify public config and separate controller/proxy authority
        run: python3 scripts/test-workload-controller-compose.py
  controller-project:
    name: Actual external controller project (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Build actual source image and validate owned HTTPS project
        run: python3 scripts/test-workload-controller-project.py --owned-engine-socket /var/run/docker.sock
  host-boundary:
    name: Linux host workload boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install and record real prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap gcc strace apparmor-utils
          bwrap --version
          bwrap --help | grep -- --disable-userns
          uname -a
      - name: Diagnose and load only the distro Bubblewrap userns policy
        run: bash scripts/ci-workload-isolation-prerequisites.sh
      - name: Run real production boundary tests (missing prerequisites fail)
        if: ${{ always() }}
        env:
          ATTUNE_TEST_RUN_ID: boundary-${{ github.run_id }}
        run: cargo test --locked --manifest-path tests/workload-sandbox-harness/Cargo.toml -- --include-ignored --test-threads=4
      - name: Preserve kernel and prerequisite evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: workload-isolation-prerequisites
          path: ${{ runner.temp }}/attune-workload-prerequisites
          if-no-files-found: error
  runtime-images:
    name: All configured workload runtime images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install YAML reader
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Build and verify shell, Python, Node, full and sensor images
        run: python3 scripts/test-workload-runtime-images.py
  docker-controller-boundary:
    name: Docker controller boundary (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      ATTUNE_TEST_RUN_ID: ctl-${{ matrix.arch }}
      ATTUNE_TEST_DOCKER_SOCKET: /var/run/docker.sock
      ATTUNE_TEST_LAUNCH_IMAGE: debian@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Record ordinary Engine policy and pull immutable owned-test image
        run: |
          docker version
          docker info --format '{{json .SecurityOptions}}'
          docker pull "$ATTUNE_TEST_LAUNCH_IMAGE"
      - name: Run actual controller modules and real Engine test (no skips)
        run: |
          cargo test --locked -p attune-launch-controller --lib -- --nocapture --test-threads=4
          cargo test --locked -p attune-launch-controller --lib real_engine_full_proc_and_readonly_policy -- --ignored --nocapture --test-threads=4
          cargo test --locked -p attune-common --lib workload_archive::tests:: -- --test-threads=4
      - name: Verify pure planner and actual helper refuses direct-host setup
        run: |
          cargo test --locked -p attune-worker --lib runtime::launch_planning::tests:: -- --test-threads=4
          cargo build --locked --profile test -p attune-worker --bin attune-workload-runner
          python3 scripts/test-workload-runner.py --binary target/debug/attune-workload-runner
  docker-controller-publication:
    name: Colocated controller and Python publication (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      SQLX_OFFLINE: 'true'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_TEST_DEBUG: '0'
      ATTUNE_TEST_RUN_ID: ctl-pub-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install pinned static-build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/workload-zig"
          "$RUNNER_TEMP/workload-zig/bin/pip" install ziglang==0.16.0
          echo "$RUNNER_TEMP/workload-zig/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.23.4
      - name: Build actual controller test executable from candidate source
        run: cargo zigbuild --locked --target ${{ matrix.target }} -p attune-launch-controller --tests --message-format=json > "$RUNNER_TEMP/controller-artifacts.jsonl"
      - name: Build actual public helper from same candidate source
        run: cargo zigbuild --locked --profile test --target ${{ matrix.target }} -p attune-worker --bin attune-workload-runner --message-format=json > "$RUNNER_TEMP/runner-artifacts.jsonl"
      - name: Build actual native HTTP action and owned local-transport tests
        run: cargo zigbuild --locked --profile test --manifest-path crates/core-actions/Cargo.toml --target ${{ matrix.target }} --tests --message-format=json > "$RUNNER_TEMP/native-http-artifacts.jsonl"
      - name: Run owned controller container and actual Engine publication test
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          artifacts = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'controller-artifacts.jsonl').read_text().splitlines() if line.startswith('{')]
          tests = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact' and item['target']['name'] == 'attune_launch_controller' and item['profile'].get('test') and item.get('executable')]
          assert len(tests) == 1, 'missing/ambiguous actual controller test executable'
          artifacts = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'runner-artifacts.jsonl').read_text().splitlines() if line.startswith('{')]
          helpers = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact' and item['target']['name'] == 'attune-workload-runner' and not item['profile'].get('test') and item.get('executable')]
          assert len(helpers) == 1, 'missing/ambiguous actual public helper executable'
          artifacts = [json.loads(line) for line in (Path(os.environ['RUNNER_TEMP']) / 'native-http-artifacts.jsonl').read_text().splitlines() if line.startswith('{')]
          native = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact' and item['target']['name'] == 'attune-core-http_request' and not item['profile'].get('test') and item.get('executable')]
          native_tests = [item['executable'] for item in artifacts if item.get('reason') == 'compiler-artifact' and item['target']['name'] == 'attune-core-http_request' and item['profile'].get('test') and item.get('executable')]
          assert len(native) == len(native_tests) == 1, 'missing/ambiguous actual native HTTP executables'
          subprocess.run(['python3', 'scripts/test-launch-controller-container.py', '--test-binary', tests[0], '--runner-binary', helpers[0], '--native-http-binary', native[0], '--native-http-tests', native_tests[0]], check=True)
          PY
