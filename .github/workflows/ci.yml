name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      run_rust_fmt:
        description: "Run: Rustfmt"
        type: boolean
        default: true
      run_rust_clippy:
        description: "Run: Clippy"
        type: boolean
        default: true
      run_rust_test:
        description: "Run: Tests"
        type: boolean
        default: true
      run_rust_audit:
        description: "Run: Cargo Audit & Deny"
        type: boolean
        default: true
      run_web_blocking:
        description: "Run: Web Blocking Checks"
        type: boolean
        default: true
      run_web_advisory:
        description: "Run: Web Advisory Checks"
        type: boolean
        default: true
      run_security_blocking:
        description: "Run: Security Blocking Checks"
        type: boolean
        default: true
      run_security_advisory:
        description: "Run: Security Advisory Checks"
        type: boolean
        default: true
  pull_request:
  push:
    branches:
      - main
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_MIN_STACK: 67108864
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          rust="false"
          web="false"
          release="false"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              rust="true"; web="true"
              release="true"
              { echo "rust=$rust"; echo "web=$web"; echo "release=$release"; } >> "$GITHUB_OUTPUT"
              echo "Changed path flags: rust=$rust web=$web release=$release (first push)"
              exit 0
            fi
          else
            # workflow_dispatch: path detection not applicable; jobs check their own input flags
            { echo "rust=false"; echo "web=false"; echo "release=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r f; do
            if printf '%s' "$f" | grep -qE '^(crates/|migrations/|Cargo\.toml$|Cargo\.lock$)' \
               || printf '%s' "$f" | grep -qE '\.rs$'; then
              rust="true"
            fi
            if printf '%s' "$f" | grep -qE '^web/'; then
              web="true"
            fi
            if printf '%s' "$f" | grep -qE '^(\.dockerignore$|\.github/workflows/|charts/|docker/|migrations/|packaging/|scripts/|config\.|docker-compose(\.[^/]*)?\.ya?ml$)'; then
              release="true"
            fi
          done < <(git diff --name-only "$base" "$head")

          { echo "rust=$rust"; echo "web=$web"; echo "release=$release"; } >> "$GITHUB_OUTPUT"
          echo "Changed path flags: rust=$rust web=$web release=$release"

  rust-fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_rust_fmt) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.rust == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Rustfmt
        run: cargo fmt --all -- --check

  release-checks:
    name: Release Configuration Checks
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release scripts
        run: |
          bash -n docker/run-migrations.sh scripts/build-linux-packages.sh scripts/upload-release-asset.sh scripts/test-upload-release-asset.sh scripts/verify-release-assets.sh scripts/test-verify-release-assets.sh
          bash scripts/test-upload-release-asset.sh
          bash scripts/test-verify-release-assets.sh
          sh -n scripts/seed-standard-pack-index.sh scripts/test-seed-standard-pack-index.sh
          sh scripts/test-seed-standard-pack-index.sh

      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7
          -ignore 'label "macos-15-intel" is unknown'

      - name: Validate Helm chart
        run: |
          helm lint charts/attune
          helm template attune charts/attune >/dev/null

  rust-clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_rust_clippy) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.rust == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache Cargo registry + index
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache Cargo build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: cargo-clippy-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml') }}
          restore-keys: |
            cargo-clippy-${{ hashFiles('**/Cargo.lock') }}-
            cargo-clippy-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  rust-test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_rust_test) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.rust == 'true')
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: attune
          POSTGRES_PASSWORD: attune
          POSTGRES_DB: attune_test
        ports:
          - 5432:5432
        options: >-
          --shm-size 256m
          --health-cmd "pg_isready -U attune -d attune_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo registry + index
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache Cargo build artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml') }}
          restore-keys: |
            cargo-test-${{ hashFiles('**/Cargo.lock') }}-
            cargo-test-

      - name: Initialize test database
        env:
          ATTUNE__ENVIRONMENT: test
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U attune -d attune_test -v ON_ERROR_STOP=1 -c "CREATE SCHEMA attune; ALTER DATABASE attune_test SET search_path TO attune, public;"
          cargo run -p attune-api --bin attune-api -- --config config.test.yaml --migrate

      - name: Record test database safety baseline
        id: test-db-baseline
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_DB: attune_test
          POSTGRES_USER: attune
        run: bash scripts/ci-test-db-safety.sh baseline

      - name: Tests
        run: >-
          cargo test --workspace --all-features -- --include-ignored --test-threads=1
          --skip test_service_creation
          --skip test_sse_stream_receives_execution_updates
          --skip test_sse_stream_filters_by_execution_id
          --skip test_sse_stream_requires_authentication
          --skip test_sse_stream_all_executions
          --skip dashboard_timezone_bucketing_handles_dst_and_non_hour_offsets
          --skip test_action_execute_with_profile
          --skip test_high_concurrency_stress
          --skip test_extreme_stress_10k_executions

      - name: Report and clean temporary test database objects
        if: always()
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          POSTGRES_DB: attune_test
          POSTGRES_USER: attune
          BASELINE_SCHEMA_COUNT: ${{ steps.test-db-baseline.outputs.schema_count }}
          BASELINE_JOB_COUNT: ${{ steps.test-db-baseline.outputs.job_count }}
        run: bash scripts/ci-test-db-safety.sh cleanup

  rust-audit:
    name: Cargo Audit & Deny
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_rust_audit) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.rust == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo registry + index
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache cargo-binstall and installed binaries
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/cargo-deny
          key: cargo-security-tools-v2

      - name: Install cargo-binstall
        run: |
          if ! command -v cargo-binstall &> /dev/null; then
            cargo install cargo-binstall --version 1.21.1 --locked
          fi

      - name: Install security tools (pre-built binaries)
        run: |
          command -v cargo-deny   &> /dev/null || cargo binstall --no-confirm --locked cargo-deny

      - name: Cargo Deny
        run: cargo deny check

  web-blocking:
    name: Web Blocking Checks
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_web_blocking) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.web == 'true')
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build

  security-blocking:
    name: Security Blocking Checks
    runs-on: ubuntu-24.04
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.run_security_blocking
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Gitleaks
        run: |
          mkdir -p "$HOME/bin"
          GITLEAKS_VERSION="8.24.2"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH="x64" ;;
            aarch64|arm64) ARCH="arm64" ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac
          curl -sSfL \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${ARCH}.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/bin" gitleaks
          chmod +x "$HOME/bin/gitleaks"

      - name: Gitleaks
        run: |
          "$HOME/bin/gitleaks" git \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --config .gitleaks.toml

  web-advisory:
    name: Web Advisory Checks
    runs-on: ubuntu-24.04
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_web_advisory) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.web == 'true')
    continue-on-error: true
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Knip
        run: npm run knip
        continue-on-error: true

      - name: NPM Audit (prod deps)
        run: npm audit --omit=dev
        continue-on-error: true

  security-advisory:
    name: Security Advisory Checks
    runs-on: ubuntu-24.04
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.run_security_advisory
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep==1.172.0

      - name: Semgrep
        run: ./scripts/run-semgrep.sh
        continue-on-error: true
