name: Windows CLI

on:
  pull_request:
    paths:
      - "crates/common/**"
      - "crates/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-cli.yml"
  push:
    branches: [main]
    paths:
      - "crates/common/**"
      - "crates/cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SQLX_OFFLINE: "true"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Test native controller file boundary
        run: cargo test --locked --package attune-common --lib repositories::native_generation_origin::tests -- --test-threads=4
      - name: Build CLI binaries
        run: cargo build --locked --package attune-cli --bins
      - name: Verify CLI binaries start
        run: |
          python scripts/test_cli_startup.py --bin-dir target/debug
