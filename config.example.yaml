# Attune Configuration Example
# Copy this file to config.yaml and customize for your environment
# For production, use environment variables to override sensitive values

# Service metadata
service_name: attune
environment: development

# Default execution timeout (seconds) snapshotted onto executions at creation time
# when neither an explicit per-execution override, a workflow task timeout, nor an
# action-level `timeout_seconds` default is provided. Must be > 0. Default: 600.
default_execution_timeout_seconds: 600

# Database configuration
database:
  # PostgreSQL connection URL
  # Format: postgresql://username:password@host:port/database
  url: postgresql://postgres:postgres@localhost:5432/attune

  # Connection pool settings
  max_connections: 50
  min_connections: 5
  connect_timeout: 30 # seconds
  idle_timeout: 600 # seconds

  # Enable SQL statement logging (useful for debugging)
  log_statements: false

  # PostgreSQL schema name (defaults to "attune" if not specified)
  schema: "attune"

# Message queue configuration (optional, for async processing)
message_queue:
  url: amqp://guest:guest@localhost:5672/%2f
  exchange: attune
  enable_dlq: true
  message_ttl: 3600 # seconds

# Server configuration
server:
  host: 0.0.0.0
  port: 8080
  request_timeout: 30 # seconds
  enable_cors: true

  # Allowed CORS origins
  # Add your frontend URLs here
  cors_origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://127.0.0.1:3000
    - http://127.0.0.1:5173

  # Maximum request body size (bytes)
  max_body_size: 10485760 # 10MB

  # Maximum number of items accepted by one bulk work queue enqueue request
  # Override with ATTUNE__SERVER__MAX_BULK_ENQUEUE_ITEMS.
  max_bulk_enqueue_items: 1000

# Logging configuration
log:
  # Log level: trace, debug, info, warn, error
  level: info

  # Log format controls stdout rendering: json for container/distributed runs,
  # pretty for local development.
  format: json

  # Reserved/no-op today. Services currently always log to stdout.
  console: true

  # Reserved for a future file sink. File logging is not currently implemented.
  # file: /var/log/attune/attune.log

# Security configuration
security:
  # JWT secret key - CHANGE THIS!
  # Generate with: openssl rand -base64 64
  jwt_secret: your-secret-key-change-this

  # JWT token expiration times (seconds)
  jwt_access_expiration: 3600 # 1 hour
  jwt_refresh_expiration: 604800 # 7 days

  # Encryption key for secrets - CHANGE THIS!
  # Must be at least 32 characters
  # Generate with: openssl rand -base64 32
  encryption_key: dev-encryption-key-at-least-32-characters-long-change-this

  # Enable authentication
  enable_auth: true

  # Login page defaults for the web UI. Users can still override with:
  #   /login?auth=direct
  #   /login?auth=<provider_name>
  login_page:
    show_local_login: true
    show_oidc_login: true
    show_ldap_login: true

  # Optional OIDC browser login configuration
  oidc:
    enabled: false
    discovery_url: https://auth.example.com/.well-known/openid-configuration
    client_id: your-confidential-client-id
    provider_name: sso
    provider_label: Example SSO
    provider_icon_url: https://auth.example.com/assets/logo.svg
    client_secret: your-confidential-client-secret
    redirect_uri: http://localhost:3000/auth/callback
    post_logout_redirect_uri: http://localhost:3000/login
    scopes:
      - groups

  # Optional LDAP authentication configuration
  ldap:
    enabled: false
    url: ldap://ldap.example.com:389
    # Direct-bind mode: construct DN from template
    # bind_dn_template: "uid={login},ou=users,dc=example,dc=com"
    # Search-and-bind mode: search for user with a service account
    user_search_base: "ou=users,dc=example,dc=com"
    user_filter: "(uid={login})"
    search_bind_dn: "cn=readonly,dc=example,dc=com"
    # SECURITY: Do NOT commit a real password to version control.
    # Inject this value via the environment variable
    #   ATTUNE__SECURITY__LDAP__SEARCH_BIND_PASSWORD
    # using Docker secrets, Kubernetes Secrets, systemd credentials, your
    # platform's secrets manager, or a `.env` file outside source control.
    # The literal value below is a placeholder that will trigger a startup WARN.
    # See docs/authentication/ldap-secrets.md for details.
    search_bind_password: "REPLACE_VIA_ENV_VAR"
    login_attr: uid
    email_attr: mail
    display_name_attr: cn
    group_attr: memberOf
    starttls: false
    danger_skip_tls_verify: false
    provider_name: ldap
    provider_label: Company LDAP

# Worker configuration (optional, for worker services)
# Uncomment and configure if running worker processes
# worker:
#   name: attune-worker-1
#   worker_type: local
#   labels:
#     zone: us-east-1a
#   taints:
#     - key: gpu
#       value: "true"
#       effect: no_schedule
#   max_concurrent_tasks: 10
#   heartbeat_interval: 30  # seconds
#   task_timeout: 300       # seconds (DEPRECATED: per-execution timeouts are now
#                           # snapshotted onto execution.timeout_seconds; see the
#                           # top-level default_execution_timeout_seconds setting)
#   execution_log_retention_policy: days      # versions, days, hours, or minutes
#   execution_log_retention_limit: 7          # interpreted by the selected policy

# Packs directory (where automation pack files are stored)
# packs_base_dir: /opt/attune/packs

# Runtime environments directory (isolated envs like virtualenvs, node_modules)
# Kept separate from pack directories so packs remain clean and read-only.
# Pattern: {runtime_envs_dir}/{pack_ref}/{runtime_name}
# Example: /opt/attune/runtime_envs/python_example/python
# runtime_envs_dir: /opt/attune/runtime_envs

# Pack registry discovery and outbound host policy. Setup resolves the standard
# index to an immutable Git commit and stores it as an API-managed row, so it can
# be listed, reordered, disabled, or permanently deleted by an administrator.
# Set ATTUNE_STANDARD_PACK_INDEX_REF to a 40-character commit SHA when setup
# must use an explicit snapshot instead of resolving index main.
pack_registry:
  enabled: true
  cache_enabled: true
  cache_ttl: 3600
  verify_checksums: true
  # Direct remote sources bypass registry-supplied checksums. Keep disabled.
  allow_unverified_direct_remote_installs: false
  allow_http: false
  approved_public_hosts:
    - raw.githubusercontent.com
    - github.com
    - codeload.github.com

# Runtime database retention. Defaults are provided by the service; uncomment to tune.
# retention:
#   enabled: true
#   check_interval_seconds: 3600
#   batch_size: 1000
#   dry_run: false
#   targets:
#     events:
#       max_age_seconds: 7776000      # 90 days
#     executions:
#       max_age_seconds: 7776000      # 90 days
#     audit_events:
#       max_age_seconds: 31536000     # 365 days

# Supervisor maintenance jobs beyond runtime retention.
# maintenance:
#   enabled: true
#   artifact_cleanup_enabled: true
#   artifact_cleanup_batch_size: 100
#   monitoring_enabled: true
#   corrective_actions_enabled: true
#   stuck_execution_seconds: 3600
#   execution_remediation_seconds: 7200
#   stuck_queue_seconds: 900
#   queue_remediation_seconds: 1800
#   admission_remediation_seconds: 1800
#   retention_lag_alert_seconds: 86400
#   alert_limit_per_cycle: 25
#   alert_cooldown_seconds: 3600

# Agent binary distribution (optional)
# ====================================
# When configured, the API exposes GET /api/v1/agent/binary so that
# universal worker agents can bootstrap themselves by downloading the
# statically-linked agent binary at startup.
#
# SECURITY: `bootstrap_token` is REQUIRED whenever `binary_dir` is set.
# Without it, the API will refuse to start. The token must be sent by
# clients via the `X-Agent-Token` header (or `?token=` query parameter).
# Generate a strong shared secret with: openssl rand -hex 32
#
# To disable agent binary downloads entirely, leave this section commented out.
# agent:
#   binary_dir: /opt/attune/agent
#   bootstrap_token: "${AGENT_BOOTSTRAP_TOKEN}"

# Environment Variable Overrides
# ==============================
# You can override any setting using environment variables with the ATTUNE__ prefix.
# Use double underscores (__) to separate nested keys.
#
# Examples:
#   ATTUNE__DATABASE__URL=postgresql://user:pass@localhost/attune
#   ATTUNE__SERVER__PORT=3000
#   ATTUNE__LOG__LEVEL=debug
#   ATTUNE__SECURITY__JWT_SECRET=your-secret-here
#   ATTUNE__SERVER__CORS_ORIGINS=https://app.com,https://www.app.com
#
# For production deployments, use environment variables for all sensitive values!
