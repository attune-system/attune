# nfpm configuration for attune-supervisor
name: attune-supervisor
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: admin
priority: optional
maintainer: "Attune <attune@rdrx.app>"
description: "Attune Supervisor - database retention and maintenance service"
vendor: "Attune"
homepage: "https://git.rdrx.app/attune/attune"
license: "Proprietary"

depends:
  - attune-common (= ${VERSION})
  - libc6 (>= 2.28)
  - postgresql-16
  - timescaledb-2-postgresql-16

contents:
  - src: "${BUNDLE_DIR}/bin/attune-supervisor"
    dst: /usr/bin/attune-supervisor
    file_info:
      mode: 0755

  - src: ../systemd/attune-supervisor.service
    dst: /usr/lib/systemd/system/attune-supervisor.service
    file_info:
      mode: 0644

scripts:
  preinstall: ../scripts/preinstall-attune-supervisor.sh
  postinstall: ../scripts/postinstall-attune-supervisor.sh
  preremove: ../scripts/preremove-attune-supervisor.sh
  postremove: ../scripts/postremove.sh

overrides:
  deb:
    deb:
      predepends:
        - attune-common (= ${VERSION})
  rpm:
    depends:
      - attune-common = ${VERSION}
      - glibc >= 2.28
      - postgresql16-server
      - timescaledb-2-postgresql-16
    rpm:
      scripts:
        posttrans: ../scripts/postupgrade-attune-supervisor.sh
  archlinux:
    depends:
      - attune-common=${VERSION}
      - glibc
      - postgresql
      - timescaledb
    archlinux:
      scripts:
        preupgrade: ../scripts/preinstall-attune-supervisor.sh
        postupgrade: ../scripts/postupgrade-attune-supervisor.sh
