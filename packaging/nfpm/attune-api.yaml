# nfpm configuration for attune-api
# https://nfpm.goreleaser.com/configuration/
name: attune-api
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: admin
priority: optional
maintainer: "Attune <attune@rdrx.app>"
description: "Attune API Gateway — REST API for the Attune automation platform"
vendor: "Attune"
homepage: "https://git.rdrx.app/attune/attune"
license: "Proprietary"

depends:
  - attune-common (= ${VERSION})
  - libc6 (>= 2.28)
  - postgresql-16
  - timescaledb-2-postgresql-16
  - rabbitmq-server

contents:
  - src: "${BUNDLE_DIR}/bin/attune-api"
    dst: /usr/bin/attune-api
    file_info:
      mode: 0755

  - src: ../systemd/attune-api.service
    dst: /usr/lib/systemd/system/attune-api.service
    file_info:
      mode: 0644

scripts:
  preinstall: ../scripts/preinstall-attune-api.sh
  postinstall: ../scripts/postinstall-attune-api.sh
  preremove: ../scripts/preremove-attune-api.sh
  postremove: ../scripts/postremove.sh

overrides:
  deb:
    deb:
      predepends:
        - attune-common (= ${VERSION})
  rpm:
    depends:
      - attune-common = ${VERSION}
      - glibc >= 2.28
      - postgresql16-server
      - timescaledb-2-postgresql-16
      - rabbitmq-server
    rpm:
      scripts:
        posttrans: ../scripts/postupgrade-attune-api.sh
  archlinux:
    depends:
      - attune-common=${VERSION}
      - glibc
      - postgresql
      - timescaledb
      - rabbitmq
    archlinux:
      scripts:
        preupgrade: ../scripts/preinstall-attune-api.sh
        postupgrade: ../scripts/postupgrade-attune-api.sh
