# nfpm configuration for the all-in-one Attune installer package.
name: attune
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: admin
priority: optional
maintainer: "Attune <attune@rdrx.app>"
description: "Attune — All-in-one installer for the Attune automation platform"
vendor: "Attune"
homepage: "https://git.rdrx.app/attune/attune"
license: "Proprietary"

depends:
  - attune-common (= ${VERSION})
  - libc6 (>= 2.28)
  - postgresql-16
  - timescaledb-2-postgresql-16
  - rabbitmq-server

conflicts:
  - attune-agent
  - attune-api
  - attune-cli
  - attune-executor
  - attune-notifier
  - attune-supervisor

replaces:
  - attune-agent
  - attune-api
  - attune-cli
  - attune-executor
  - attune-notifier
  - attune-supervisor

contents:
  - src: "${BUNDLE_DIR}/bin/attune-api"
    dst: /opt/attune-system/attune-api
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/bin/attune-executor"
    dst: /opt/attune-system/attune-executor
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/bin/attune-notifier"
    dst: /opt/attune-system/attune-notifier
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/bin/attune-supervisor"
    dst: /opt/attune-system/attune-supervisor
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/bin/attune-worker"
    dst: /opt/attune-system/attune-worker
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/bin/attune-sensor"
    dst: /opt/attune-system/attune-sensor
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/agent/attune"
    dst: /opt/attune-system/attune
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/agent/attune-mcp"
    dst: /opt/attune-system/attune-mcp
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/agent/attune-agent"
    dst: /opt/attune-system/attune-agent
    file_info:
      mode: 0755

  - src: "${BUNDLE_DIR}/agent/attune-sensor-agent"
    dst: /opt/attune-system/attune-sensor-agent
    file_info:
      mode: 0755

  - src: /opt/attune-system/attune
    dst: /usr/bin/attune
    type: symlink

  - src: /opt/attune-system/attune-mcp
    dst: /usr/bin/attune-mcp
    type: symlink

  # Shell completion scripts, generated from the packaged binary at build
  # time so they can never drift from the installed command surface.
  - src: "${COMPLETIONS_DIR}/attune.bash"
    dst: /usr/share/bash-completion/completions/attune
    file_info:
      mode: 0644

  - src: "${COMPLETIONS_DIR}/attune.fish"
    dst: /usr/share/fish/vendor_completions.d/attune.fish
    file_info:
      mode: 0644

  # zsh fpath varies by distro: Debian compiles in vendor-completions,
  # Fedora/Arch default to site-functions. Ship both, one per packager.
  - src: "${COMPLETIONS_DIR}/_attune"
    dst: /usr/share/zsh/vendor-completions/_attune
    packager: deb
    file_info:
      mode: 0644

  - src: "${COMPLETIONS_DIR}/_attune"
    dst: /usr/share/zsh/site-functions/_attune
    packager: rpm
    file_info:
      mode: 0644

  - src: "${COMPLETIONS_DIR}/_attune"
    dst: /usr/share/zsh/site-functions/_attune
    packager: archlinux
    file_info:
      mode: 0644

  - src: ../systemd-opt/attune-api.service
    dst: /usr/lib/systemd/system/attune-api.service
    file_info:
      mode: 0644

  - src: ../systemd-opt/attune-executor.service
    dst: /usr/lib/systemd/system/attune-executor.service
    file_info:
      mode: 0644

  - src: ../systemd-opt/attune-notifier.service
    dst: /usr/lib/systemd/system/attune-notifier.service
    file_info:
      mode: 0644

  - src: ../systemd-opt/attune-supervisor.service
    dst: /usr/lib/systemd/system/attune-supervisor.service
    file_info:
      mode: 0644

  - src: ../systemd-opt/attune-worker.service
    dst: /usr/lib/systemd/system/attune-worker.service
    file_info:
      mode: 0644

  - src: ../systemd-opt/attune-sensor.service
    dst: /usr/lib/systemd/system/attune-sensor.service
    file_info:
      mode: 0644

  - src: ../doc/attune-installer.txt
    dst: /usr/share/doc/attune/README
    file_info:
      mode: 0644

scripts:
  preinstall: ../scripts/preinstall-attune.sh
  postinstall: ../scripts/postinstall-attune.sh
  preremove: ../scripts/preremove.sh
  postremove: ../scripts/postremove.sh

overrides:
  deb:
    deb:
      predepends:
        - attune-common (= ${VERSION})
  rpm:
    depends:
      - attune-common = ${VERSION}
      - glibc >= 2.28
      - postgresql16-server
      - timescaledb-2-postgresql-16
      - rabbitmq-server
    rpm:
      scripts:
        posttrans: ../scripts/postupgrade-attune.sh
  archlinux:
    depends:
      - attune-common=${VERSION}
      - glibc
      - postgresql
      - timescaledb
      - rabbitmq
    archlinux:
      scripts:
        preupgrade: ../scripts/preinstall-attune.sh
        postupgrade: ../scripts/postupgrade-attune.sh
