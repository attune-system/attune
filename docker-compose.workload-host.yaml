# Draft external Engine/controller project. Run on the workload host, separately
# from the CP/DB/MQ/master-bearing primary Compose project. This is not a legacy
# worker fallback or evidence that the unfinished full backend is ready.
services:
  launch-controller:
    build:
      context: .
      dockerfile: docker/Dockerfile.optimized
      args:
        SERVICE: launch-controller
        SERVICE_USER: root
    # Local source-build output, never an asserted published release pin.
    image: attune-launch-controller:source
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    networks: [default, workloads]
    entrypoint:
      - /usr/bin/env
      - -i
      - PATH=/usr/local/bin:/usr/bin:/bin
      - HOME=/tmp
      - TMPDIR=/tmp
      - SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
      - ATTUNE_LAUNCH_CONFIG=/run/secrets/attune-controller-config
      - /usr/local/bin/attune-service
    secrets:
      - attune-controller-config
      - attune-controller-session
    volumes:
      - launch-cache:/var/lib/attune/launch
      - controller-state:/var/lib/attune/controller
      # Public trust anchors only; owned CI can provide its generated CA here
      # without disabling HTTPS verification or changing global host trust.
      - type: bind
        source: ${ATTUNE_LAUNCH_CP_CA_BUNDLE:-/etc/ssl/certs/ca-certificates.crt}
        target: /etc/ssl/certs/ca-certificates.crt
        read_only: true
      # Trusted controller only. Never mount into an execution host or pack.
      - type: bind
        source: ${ATTUNE_LAUNCH_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=536870912,mode=0700
    ports:
      # The separate TLS proxy shares this network namespace, not its files,
      # PID namespace, credentials or Engine socket. No plaintext port opens.
      - "${ATTUNE_LAUNCH_TLS_BIND:?set the owned TLS listen address}:8443:8443"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8092/health]
      interval: 10s
      timeout: 3s
      retries: 3
    stop_grace_period: 120s

  launch-proxy:
    # An actual validated nginx image supporting this TLS config as uid1000.
    # Its /usr/sbin/nginx entrypoint is fixed. No new
    # unpublished proxy/agent/controller digest is invented by this project.
    image: ${ATTUNE_LAUNCH_PROXY_IMAGE:?set an actual validated immutable nginx image}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: service:launch-controller
    depends_on:
      launch-controller:
        condition: service_started
    entrypoint: [/usr/bin/env, -i, PATH=/usr/sbin:/usr/bin:/bin, HOME=/tmp, TMPDIR=/tmp, /usr/sbin/nginx]
    command: [-c, /etc/attune/launch-proxy.conf, -g, "daemon off;"]
    volumes:
      - ./docker/workload-launch-proxy.conf:/etc/attune/launch-proxy.conf:ro
    secrets:
      - source: attune-controller-certificate
        target: /etc/attune/controller.crt
      - source: attune-controller-private-key
        target: /etc/attune/controller.key
    healthcheck:
      test: [CMD, /usr/sbin/nginx, -t, -c, /etc/attune/launch-proxy.conf]
      interval: 10s
      timeout: 3s
      retries: 3
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16777216,uid=1000,gid=1000,mode=0700
    stop_grace_period: 120s

secrets:
  # File metadata is checked at actual startup. Compose file-secret modes do
  # not replace installing root-owned regular single-link config/session files.
  attune-controller-config:
    file: ${ATTUNE_LAUNCH_CONFIG_FILE:?set the root-owned public controller config file}
  attune-controller-session:
    file: ${ATTUNE_LAUNCH_SESSION_FILE:?set the private CP-issued controller session file}
  attune-controller-certificate:
    file: ${ATTUNE_LAUNCH_TLS_CERTIFICATE:?set the real public TLS certificate chain file}
  attune-controller-private-key:
    file: ${ATTUNE_LAUNCH_TLS_PRIVATE_KEY:?set the dedicated TLS private key file}

volumes:
  launch-cache:
    name: ${ATTUNE_LAUNCH_CACHE_VOLUME:?must match config and the exact local Engine volume}
    driver: local
  controller-state:
    # Independent private session custody; never mounted into a pack or proxy.
    name: ${ATTUNE_LAUNCH_STATE_VOLUME:?set the dedicated retained controller state volume}
    driver: local

networks:
  default:
    driver: bridge
  workloads:
    name: ${ATTUNE_LAUNCH_NETWORK:?must match the fixed admitted workload bridge}
    driver: bridge
