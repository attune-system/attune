# Attune Core Pack
# Built-in core functionality including timers, utilities, and basic actions

ref: core
label: "Core Pack"
description: "Built-in core functionality including timer triggers and standalone native utility actions"
version: "1.0.7"
author: "Attune Team"
email: "core@attune.io"

# Pack is a system pack (shipped with Attune)
system: true

# Pack configuration schema (StackStorm-style flat format)
conf_schema:
  max_action_timeout:
    type: integer
    description: "Maximum timeout for action execution in seconds"
    default: 300
    minimum: 1
    maximum: 3600
  enable_debug_logging:
    type: boolean
    description: "Enable debug logging for core pack actions"
    default: false

# Default pack configuration
config:
  max_action_timeout: 300
  enable_debug_logging: false

# Pack metadata
meta:
  category: "system"
  keywords:
    - "core"
    - "utilities"
    - "timers"
    - "native"

  # Documentation
  documentation_url: "https://docs.attune.io/packs/core"
  repository_url: "https://github.com/attune-io/attune"

# Pack tags for discovery
tags:
  - core
  - system
  - utilities
  - timers

# Runtime dependencies
runtime_deps:
  - native

# Enabled by default
enabled: true

# Native actions are tested by their standalone Cargo suite and publication tests.
# Candidate test runners currently require an interpreter; core actions do not.
testing:
  enabled: false
  discovery:
    method: directory
  runners: {}
