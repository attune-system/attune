pid /tmp/nginx.pid;
# Runtime errors can include client request/header text. Do not retain those
# alongside private channel grants or selected input, even for malformed input.
error_log /dev/null;
worker_processes 1;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    # Compiled modules initialize their default temp paths even without a
    # matching upstream location. Keep every such path in bounded private tmp.
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 8m;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/attune/controller.crt;
        ssl_certificate_key /etc/attune/controller.key;
        location = /health {
            proxy_pass http://127.0.0.1:8092;
            proxy_set_header Host $http_host;
        }
        location /v1/launches/ {
            proxy_pass http://127.0.0.1:8092;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_pass_request_headers on;
            proxy_pass_request_body on;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 40s;
            proxy_send_timeout 40s;
        }
        location / { return 404; }
    }
}
