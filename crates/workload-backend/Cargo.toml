[package]
name = "attune-workload-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "attune-workload-runner"
path = "src/runner_main.rs"

[dependencies]
attune-common = { path = "../common" }
# Use the workspace's Rustls provider; kube initializes this provider in its
# client builder, including when transitive dependencies also enable ring.
kube = { version = "=5.1.0", default-features = false, features = ["client", "config", "rustls-tls", "aws-lc-rs", "ws"] }
k8s-openapi = { version = "=0.29.0", features = ["earliest"] }
chrono = { workspace = true }
async-trait = { workspace = true }
http = "1"
tungstenite = "=0.30.0"
futures = { workspace = true }
libc = "0.2"
reqwest = { workspace = true, features = ["query"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
serde_yaml_ng = { workspace = true }
