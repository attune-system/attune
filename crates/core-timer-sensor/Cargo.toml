[package]
name = "core-timer-sensor"
version = "0.5.1"
edition = "2021"
authors = ["Attune Contributors"]
license = "Apache-2.0"
description = "Standalone timer sensor runtime for Attune core pack"

# This crate is intentionally NOT a workspace member of the Attune root
# workspace (see the `exclude` list in /Cargo.toml). Local Compose builds it
# with docker/Dockerfile.pack-binaries. Release CI builds it into the Rust
# architecture bundle and includes it in the init-packs image. The resulting
# static musl binary ships in the packs_data volume.

[[bin]]
name = "attune-core-timer-sensor"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.13", features = ["json"] }

# WebSocket stream + async helpers
futures = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Cron scheduling
tokio-cron-scheduler = "0.15"

# Recurrence rules (RFC 5545 RRULE) for the rruletimer trigger
rrule = "0.14"
chrono-tz = "0.10"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Utilities
uuid = { version = "1.23", features = ["v4", "serde"] }
urlencoding = "2.1"
base64 = "0.22"

[dev-dependencies]
mockall = "0.14"
tempfile = "3.27"
