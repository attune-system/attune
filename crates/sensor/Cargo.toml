[package]
name = "attune-sensor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "attune_sensor"
path = "src/lib.rs"

[[bin]]
name = "attune-sensor"
path = "src/main.rs"

[[bin]]
name = "attune-sensor-agent"
path = "src/agent_main.rs"

[dependencies]
attune-worker = { path = "../worker" }
attune-workload-backend = { path = "../workload-backend" }
attune-common = { path = "../common" }
tokio = { workspace = true }
tokio-util = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
config = { workspace = true }

chrono = { workspace = true }
clap = { workspace = true }
lapin = { workspace = true }
regex = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true }
hostname = "0.4"
tempfile = { workspace = true }
uuid = { workspace = true }
libc = "0.2"

[dev-dependencies]
attune-api = { path = "../api" }
axum = { workspace = true }
tower = { workspace = true }
serde_yaml_ng = { workspace = true }
kube = { version = "=5.1.0", default-features = false, features = ["client", "config", "rustls-tls", "ws"] }
k8s-openapi = { version = "=0.29.0", features = ["earliest"] }
zip = { workspace = true }
