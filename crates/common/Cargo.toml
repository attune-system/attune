[package]
name = "attune-common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util = { workspace = true }
libc = "0.2"
async-trait = { workspace = true }
async-recursion = "1.1"
futures = { workspace = true }
bytes = { workspace = true }
object_store = { workspace = true }
rand = "0.8"

# Database
sqlx = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }

# Configuration
config = { workspace = true }

# HTTP client
reqwest = { workspace = true }

# Archive (for pack transport)
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
ignore = { workspace = true }
tempfile = { workspace = true }
# Format-1 encoding and Unicode 15.1 are byte-level contracts.
miniz_oxide = "=0.9.1"
icu_casemap = "=1.5.1"
icu_casemap_data = "=1.5.1"
icu_normalizer_v1 = { package = "icu_normalizer", version = "=1.5.0" }
icu_normalizer_data_v1 = { package = "icu_normalizer_data", version = "=1.5.1" }
serde_jcs = "=0.2.0"

# Message Queue
lapin = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Date/Time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Validation
validator = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# JSON Schema
schemars = { workspace = true }
jsonschema = { workspace = true }

# OpenAPI
utoipa = { workspace = true }

# JWT
jsonwebtoken = { workspace = true }
hmac = { workspace = true }

# Encryption
argon2 = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }

# File system utilities
walkdir = { workspace = true }

# Regular expressions
regex = { workspace = true }

# Version matching
semver = { workspace = true }
url = { workspace = true }

[dev-dependencies]
mockall = { workspace = true }
tempfile = { workspace = true }

[[test]]
name = "test_database_lifecycle_helper"
path = "tests/test_database_lifecycle_helper.rs"
harness = false
