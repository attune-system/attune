[package]
name = "attune-worker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "attune-worker"
path = "src/main.rs"

[[bin]]
name = "attune-agent"
path = "src/agent_main.rs"

[dependencies]
attune-common = { path = "../common" }
attune-workload-backend = { path = "../workload-backend" }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
config = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
lapin = { workspace = true }
reqwest = { workspace = true }
hostname = "0.4"
regex = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
jsonwebtoken = { workspace = true }
uuid = { workspace = true }
libc = "0.2"
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
attune-api = { path = "../api" }
tower = { workspace = true }
kube = { version = "=5.1.0", default-features = false, features = ["client", "config", "rustls-tls", "ws"] }
k8s-openapi = { version = "=0.29.0", features = ["earliest"] }
axum = { workspace = true }
futures = { workspace = true }
serde_jcs = "=0.2.0"
